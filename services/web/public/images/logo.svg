         stop-color="#556cb2"
         id="stop3" />
      <stop
         offset="100%"
         stop-color="#72a5db"
         id="stop4" />
    </linearGradient>
    <!-- Filtro de resplandor Neón Cian/Blanco -->
    <filter
       id="neonGlow"
       x="-0.032120452"
       y="-0.15912759"
       width="1.0642409"
       height="1.3182552">
      <!-- Resplandor exterior azul cian -->
      <feGaussianBlur
         stdDeviation="6"
         result="blur1"
         id="feGaussianBlur4" />
      <feFlood
         flood-color="#8ce4ff"
         flood-opacity="0.85"
         result="color1"
         id="feFlood4" />
      <feComposite
         in="color1"
         in2="blur1"
         operator="in"
         result="glow1"
         id="feComposite4" />
      <!-- Resplandor medio cian intenso -->
      <feGaussianBlur
         stdDeviation="2.5"
         result="blur2"
         id="feGaussianBlur5" />
      <feFlood
         flood-color="#aeeeff"
         flood-opacity="0.95"
         result="color2"
         id="feFlood5" />
      <feComposite
         in="color2"
         in2="blur2"
         operator="in"
         result="glow2"
         id="feComposite5" />
      <!-- Resplandor interno blanco brillante -->
      <feGaussianBlur
         stdDeviation="1"
         result="blur3"
         id="feGaussianBlur6" />
      <feFlood
         flood-color="#ffffff"
         flood-opacity="1"
         result="color3"
         id="feFlood6" />
      <feComposite
         in="color3"
         in2="blur3"
         operator="in"
         result="glow3"
         id="feComposite6" />
      <feMerge
         id="feMerge9">
        <feMergeNode
           in="glow1"
           id="feMergeNode6" />
        <feMergeNode
           in="glow2"
           id="feMergeNode7" />
        <feMergeNode
           in="glow3"
           id="feMergeNode8" />
        <feMergeNode
           in="SourceGraphic"
           id="feMergeNode9" />
      </feMerge>
    </filter>
    <linearGradient
       inkscape:collect="always"
