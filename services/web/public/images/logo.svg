  <defs
     id="defs9">
    <!-- Gradiente exacto de morado oscuro a azul claro -->
    <linearGradient
       id="perceptorGrad"
       x1="0"
       y1="0"
       x2="1"
       y2="0">
      <stop
         offset="0%"
         stop-color="#2d2050"
         id="stop1" />
      <stop
         offset="50%"
         stop-color="#3c2a68"
         id="stop2" />
      <stop
