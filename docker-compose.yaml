services:

  traefik:
    image: traefik:v3.7
    container_name: perceptor-traefik
    restart: unless-stopped
    # Off by default (REQ-16): a fresh installation binds neither 80 nor 443 and mounts no
    # Docker socket unless an operator opts in with COMPOSE_PROFILES=traefik in .env. Naming
    # the service explicitly on a command line (bin/dev does this when USE_TRAEFIK=true)
    # still starts it despite the profile.
    profiles: [traefik]
    ports:
      - "80:80"
      - "443:443"
      # - "8080:8080" # Descomentar si querés ver el Dashboard de Traefik
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # - "--api.insecure=true" # Descomentar si querés habilitar el Dashboard en el puerto 8080
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - perceptor-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3      

  web:
    image: ghcr.io/dientuki/perceptor-web:${PERCEPTOR_TAG:-latest}
    container_name: perceptor-web
    restart: unless-stopped
    # Mismo criterio que api/worker: no root, para que node_modules/.next que
    # el CMD de dev escribe en el bind mount queden con el dueño del host en
    # vez de con el uid de la imagen.
    user: "${PUID}:${PGID}"
    ports:
      - "${WEB_PORT}:3000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - DOMAIN=${DOMAIN}
      - INTERNAL_GRAPHQL_URL=http://api:${API_PORT}/graphql
      # Leída por un server action (services/web/src/actions/uploads.ts), no por
      # el bundle del browser — necesita una URL resoluble desde afuera del
      # stack, no la interna de Docker de arriba (esa sólo la ven los containers
      # entre sí).
      - PUBLIC_UPLOAD_URL=${PUBLIC_UPLOAD_URL}
    depends_on:
      api:
        condition: service_healthy      
    healthcheck:
      # 127.0.0.1, no localhost: el server.js standalone que genera Next
      # sólo escucha en IPv4 (0.0.0.0:3000), y "localhost" en este contenedor
      # resuelve primero a ::1 — wget se conecta ahí y se lo rechazan.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Mismo motivo que en api: en un checkout limpio el CMD de dev instala
      # node_modules antes de levantar, y un start_period corto marca el
      # container "unhealthy" en medio de esa instalación.
      start_period: 60s
    networks:
      - perceptor-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=3000"      

  api:
    image: ghcr.io/dientuki/perceptor-api:${PERCEPTOR_TAG:-latest}
    container_name: perceptor-api
    restart: unless-stopped
    # No root: /uploads (ver src/uploads/) escribe en el disco de descargas, y
    # el archivo tiene que quedar con el mismo dueño/grupo que espera el
    # worker — mismo criterio que ya se le aplicó a ese servicio.
    user: "${PUID}:${PGID}"
    group_add:
      - "${MEDIA_GID}"
    ports:
      - "${API_PORT}:${API_PORT}" # Mapeamos al puerto especificado para no chocar con Next.js
    volumes:
      - ${HOST_DOWNLOADS_DIR}:${CONTAINER_DOWNLOADS_DIR}
      # Sólo lectura: el api resuelve/valida rutas de biblioteca (media-roots),
      # nunca escribe ahí — eso lo hace el worker, que sí monta rw más abajo.
      - ${HOST_DESTINATIONS_DIR}:${CONTAINER_DESTINATIONS_DIR}:ro
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${API_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DOMAIN=${DOMAIN}
      - WEB_PORT=${WEB_PORT}
      # No default, ever (REQ-6) — auth.constants.ts's assertAuthEnv() fails boot loudly if unset.
      - JWT_SECRET=${JWT_SECRET}
      # Prowlarr's API key, read by the settings seed as tracker_api_key (014-dev-stack-flaresolverr).
      - INDEXER_API_KEY=${INDEXER_API_KEY}
      # Backfills the movie_db_api_key Setting on boot when it is still empty (049, Contract
      # Freeze) — never a Settings write path beyond that, and never queried by install.sh itself.
      - TMDB_API_KEY=${TMDB_API_KEY}
      # Opt-out only, default on (049, Contract Freeze): api applies pending Prisma migrations
      # and runs the production seed before it starts listening, unless this is set to false.
      - PERCEPTOR_AUTO_MIGRATE=${PERCEPTOR_AUTO_MIGRATE}
      # Raíces que media-roots.module.ts arma como MEDIA_ROOTS: HOST_* es lo que
      # la UI muestra (la ruta real en la PC del usuario), CONTAINER_* es dónde
      # vive ese mismo mount adentro de este container.
      - HOST_DOWNLOADS_DIR=${HOST_DOWNLOADS_DIR}
      - CONTAINER_DOWNLOADS_DIR=${CONTAINER_DOWNLOADS_DIR}
      - HOST_DESTINATIONS_DIR=${HOST_DESTINATIONS_DIR}
      - CONTAINER_DESTINATIONS_DIR=${CONTAINER_DESTINATIONS_DIR}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 3000) + '/graphql', (res) => process.exit(res.statusCode < 500 ? 0 : 1))"]
      #test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Generoso a propósito: en un checkout limpio (sin node_modules) el
      # CMD de dev corre npm install + prisma generate antes de levantar,
      # lo que puede tardar 40s+ — y en el runner publicado, PERCEPTOR_AUTO_MIGRATE
      # corre `prisma migrate deploy` + el seed de producción antes del primer
      # request, lo que en una biblioteca grande se mide en minutos, no segundos
      # (NFR-5). Con un start_period corto, los healthchecks que fallan durante
      # ese arranque cuentan como fallas reales y el container queda "unhealthy"
      # antes de terminar de migrar.
      start_period: 600s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backup:
        condition: service_completed_successfully
      #prowlarr:
      #  condition: service_healthy
      #torrent:
      #  condition: service_healthy
    networks:
      - perceptor-net
    # El media server (Jellyfin) suele correr afuera del stack, en el host del
    # usuario — no hay un `localhost` compartido entre el container y el host:
    # dentro del container, `localhost` es el propio api. `host-gateway` es un
    # valor especial de Docker (soportado en Linux desde 20.10, no sólo
    # Desktop) que resuelve `host.docker.internal` a la IP del host real. Con
    # esto, media_server_host=host.docker.internal en Settings apunta a
    # Jellyfin corriendo en la PC del usuario.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=${API_PORT}"      

  db:
    image: mariadb:12.3.2
    container_name: perceptor-db
    restart: always
    # No port published to the host (NFR-8) — reachable on perceptor-net only. The build
    # overlay republishes DB_PORT for a development client (TablePlus, mariadb CLI, ...).
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Mantiene los datos guardados en un volumen gestionado por Docker
      - mariadb_data:/var/lib/mysql
    networks:
      - perceptor-net
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p'${DB_ROOT_PASSWORD}'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot dump, taken before api applies any pending migration (REQ-12): a failed backup
  # blocks api's boot via depends_on/service_completed_successfully rather than letting a
  # migration run unprotected. Rotates to the five most recent dumps under ./backups, visible
  # from the host with no Docker command. Reuses the mariadb image already pulled for db — no
  # new image, no script the user has to download.
  backup:
    image: mariadb:12.3.2
    container_name: perceptor-backup
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./backups:/backups
    networks:
      - perceptor-net
    command:
      - /bin/bash
      - -c
      - |
        # pipefail is load-bearing: without it, "mariadb-dump | gzip" reports gzip's exit code
        # (0, even on an empty input) instead of mariadb-dump's — a failed dump would look
        # successful to `set -e` and to compose's service_completed_successfully, letting a
        # migration proceed unprotected (REQ-12/AC-7). /bin/sh (dash on this image) has no
        # pipefail, hence bash here instead of the sh the rest of this file's one-liners use.
        set -euo pipefail
        stamp=$$(date +%Y%m%d%H%M%S)
        dest="/backups/${DB_NAME}-$${stamp}.sql.gz"
        # The redirect that writes dest opens the file before the pipeline runs, so a failed
        # dump still leaves a truncated/empty .gz on disk — the trap removes it instead of
        # letting it survive as a backup that would fail to restore if anyone reached for it.
        trap 'rm -f "$${dest}"' ERR
        echo "Dumping ${DB_NAME} to $${dest}..."
        mariadb-dump -h db -u root -p"$${MARIADB_ROOT_PASSWORD}" "$${DB_NAME}" | gzip > "$${dest}"
        echo "Rotating: keeping the 5 most recent dumps..."
        cd /backups
        ls -1t "${DB_NAME}"-*.sql.gz 2>/dev/null | tail -n +6 | xargs -r rm -f
        echo "Done."

  worker:
    image: ghcr.io/dientuki/perceptor-worker:${PERCEPTOR_TAG:-latest}
    container_name: perceptor-worker
    restart: unless-stopped
    # Verificado en vivo: ffmpeg con SVT-AV1 puede tardar ~9s en morir tras
    # SIGTERM (multi-hilo, necesita desarmar el encoder) — el default de
    # Docker (10s) deja casi sin margen para que corra el resto de la
    # limpieza de runner.ts (rm de temporales en dos discos distintos) antes
    # de que Docker escale a SIGKILL, que no le da tiempo a nada.
    stop_grace_period: 60s
    # No root: los archivos que arma (biblioteca de Jellyfin) tienen que quedar
    # con el mismo dueño que el resto — MEDIA_GID (no necesariamente PGID, que
    # también consumen torrent/indexer) es el grupo dueño de esas carpetas.
    user: "${PUID}:${PGID}"
    group_add:
      - "${MEDIA_GID}"
    volumes:
      - ${HOST_DOWNLOADS_DIR}:${CONTAINER_DOWNLOADS_DIR}
      - ${HOST_DESTINATIONS_DIR}:${CONTAINER_DESTINATIONS_DIR}
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - INTERNAL_GRAPHQL_URL=http://api:${API_PORT}/graphql
      # The worker's identity against the api's GraphQL guard (REQ-5) — a machine credential,
      # never a user session. See services/worker/src/api/graphql-client.ts.
      - SERVICE_TOKEN=${SERVICE_TOKEN}
      - ENCODE_DRIVER=${ENCODE_DRIVER}
      - ENCODE_SAMPLE_SECONDS=${ENCODE_SAMPLE_SECONDS}
      - ENCODE_MOCK_SECONDS=${ENCODE_MOCK_SECONDS}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - perceptor-net

  redis:
    image: redis:7-alpine
    container_name: perceptor-redis
    restart: unless-stopped
    # No port published to the host (NFR-8) — reachable on perceptor-net only. The build
    # overlay republishes REDIS_PORT for Redis Insight/TablePlus in development.
    command: >
      redis-server 
      --save 60 1 
      --loglevel notice 
      --maxmemory 256mb 
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - perceptor-net      
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5  

  torrent:
    image: ghcr.io/dientuki/perceptor-torrent:${PERCEPTOR_TAG:-latest}
    container_name: perceptor-torrent
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}/tcp"
      - "${QBITTORRENT_TORRENTING_PORT}:${QBITTORRENT_TORRENTING_PORT}/tcp"
      - "${QBITTORRENT_TORRENTING_PORT}:${QBITTORRENT_TORRENTING_PORT}/udp"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
      - TORRENTING_PORT=${QBITTORRENT_TORRENTING_PORT}
      - QBITTORRENT_USER=${QBITTORRENT_USER}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
      - INTERNAL_GRAPHQL_URL=http://api:${API_PORT}/graphql
      # Read by services/torrent/commands/on-torrent-completed.sh (AutoRun hook) to authenticate
      # the torrentCompleted call — same machine credential as the worker (REQ-5).
      - SERVICE_TOKEN=${SERVICE_TOKEN}
    volumes:
      # Configuración persistente del cliente (resume de descargas, torrents activos, etc.)
      - qbittorrent_config:/config

      # Mapeo a la misma carpeta de descargas que lee el worker
      - ${HOST_DOWNLOADS_DIR}:${CONTAINER_DOWNLOADS_DIR}

      # El script de AutoRun (on-torrent-completed.sh) ya viaja dentro de la imagen
      # (services/torrent/Dockerfile, COPY --chmod=755 commands/) — sin bind mount, una
      # instalación sin este repositorio en disco sigue reportando descargas completas (REQ-4).
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${QBITTORRENT_WEBUI_PORT}/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s      
    networks:
      - perceptor-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.torrent.rule=Host(`torrent.${DOMAIN}`)"
      - "traefik.http.routers.torrent.entrypoints=web"
      # Le indicamos a Traefik el puerto interno de la WebUI
      - "traefik.http.services.torrent.loadbalancer.server.port=${QBITTORRENT_WEBUI_PORT}"      
    
  indexer:
    image: ghcr.io/dientuki/perceptor-indexer:${PERCEPTOR_TAG:-latest}
    container_name: perceptor-indexer
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - INDEXER_USER=${INDEXER_USER}
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      # Prowlarr's API key — declared, not discovered (014-dev-stack-flaresolverr). Applied to
      # config.xml before Prowlarr starts by custom-cont-init.d/10-prowlarr-apikey, and read by
      # custom-services.d/20-prowlarr-flaresolverr to talk to Prowlarr's own API.
      - INDEXER_API_KEY=${INDEXER_API_KEY}
    volumes:
      - indexer_config:/config
    ports:
      - "${INDEXER_PORT}:9696"
    depends_on:
      flaresolverr:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9696/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - perceptor-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.indexer.rule=Host(`indexer.${DOMAIN}`)"
      - "traefik.http.routers.indexer.entrypoints=web"
      - "traefik.http.services.indexer.loadbalancer.server.port=9696"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: perceptor-cloudflare-proxy
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    healthcheck:
      # The image is python:slim-based — no curl, no wget — so the healthcheck calls the
      # interpreter that is provably present instead. Verified against the running container.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8191/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - perceptor-net
    # No ports:, no labels: — the only consumer is Prowlarr, on perceptor-net (REQ-8).

volumes:
  mariadb_data:
  redis_data:
  qbittorrent_config: # Nuevo volumen para la config de qBittorrent
  indexer_config: # Nuevo volumen para la config de Prowlarr

networks:
  perceptor-net:
    driver: bridge  