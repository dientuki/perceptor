services:

  traefik:
    image: traefik:v3.7
    container_name: perceptor-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # - "8080:8080" # Descomentar si querés ver el Dashboard de Traefik
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # - "--api.insecure=true" # Descomentar si querés habilitar el Dashboard en el puerto 8080
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - perceptor-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3      

  web:
    build:
      context: ./services/web
      #dockerfile: docker/web.Dockerfile
      target: ${BUILD_TARGET:-dev}
    container_name: perceptor-web
    ports:
      - "${WEB_PORT}:3000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      # Mapea services/web al directorio /app del contenedor.
      # Esto hace que los node_modules instalados en el build se escriban
      # directamente en services/web/node_modules de tu host.
      - ./services/web:/app
    environment:
      - NODE_ENV=${NODE_ENV}
      # Necesario en Linux para que Next.js detecte cambios de archivos con Hot Reload/HMR a través de Docker
      - WATCHPACK_POLLING=true
      - DOMAIN=${DOMAIN}
      - INTERNAL_GRAPHQL_URL=http://api:${API_PORT}/graphql
    depends_on:
      api:
        condition: service_healthy      
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s      
    networks:
      - perceptor-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=3000"      

  api:
    build:
      context: ./services/api
      #dockerfile: docker/api.Dockerfile
      target: ${BUILD_TARGET:-dev}
    container_name: perceptor-api
    ports:
      - "${API_PORT}:${API_PORT}" # Mapeamos al puerto especificado para no chocar con Next.js
    volumes:
      - ./services/api:/app
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${API_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 3000) + '/graphql', (res) => process.exit(res.statusCode < 500 ? 0 : 1))"]
      #test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s      
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      #prowlarr:
      #  condition: service_healthy
      #torrent:
      #  condition: service_healthy
    networks:
      - perceptor-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=${API_PORT}"      

  db:
    image: mariadb:12.3.2
    container_name: perceptor-db
    restart: always
    ports:
      - "${DB_PORT}:3306" # Mapeado al host para conectar clientes externos
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Mantiene los datos guardados en un volumen gestionado por Docker
      - mariadb_data:/var/lib/mysql
    networks:
      - perceptor-net
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p'${DB_ROOT_PASSWORD}'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s           

  worker:
    build:
      context: ./services/worker
      #dockerfile: docker/worker.Dockerfile
      target: ${BUILD_TARGET:-dev}
    container_name: perceptor-worker
    volumes:
      - ./services/worker:/app
      - ${HOST_DOWNLOADS_DIR}:${CONTAINER_DOWNLOADS_DIR}
      - ${HOST_DESTINATIONS_DIR}:${CONTAINER_DESTINATIONS_DIR}
    environment:
      - NODE_ENV=${NODE_ENV}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - DOWNLOADS_DIR=${CONTAINER_DOWNLOADS_DIR}
      - DESTINATIONS_DIR=${CONTAINER_DESTINATIONS_DIR}
      - INTERNAL_GRAPHQL_URL=http://api:${API_PORT}/graphql
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - perceptor-net

  redis:
    image: redis:7-alpine
    container_name: perceptor-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}" # Expuesto al host por si querés inspeccionar con Redis Insight o TablePlus
    command: >
      redis-server 
      --save 60 1 
      --loglevel notice 
      --maxmemory 256mb 
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - perceptor-net      
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5  

  torrent:
    build:
      context: ./services/torrent
    container_name: perceptor-torrent
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}/tcp"
      - "${QBITTORRENT_TORRENTING_PORT}:${QBITTORRENT_TORRENTING_PORT}/tcp"
      - "${QBITTORRENT_TORRENTING_PORT}:${QBITTORRENT_TORRENTING_PORT}/udp"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
      - TORRENTING_PORT=${QBITTORRENT_TORRENTING_PORT}
      - QBITTORRENT_USER=${QBITTORRENT_USER}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
      - INTERNAL_GRAPHQL_URL=http://api:${API_PORT}/graphql
    volumes:
      # Configuración persistente del cliente (resume de descargas, torrents activos, etc.)
      - qbittorrent_config:/config

      # Mapeo a la misma carpeta de descargas que lee el worker
      - ${HOST_DOWNLOADS_DIR}:${CONTAINER_DOWNLOADS_DIR}

      # Script de AutoRun que avisa al api cuando termina una descarga
      - ./services/torrent/commands:/commands:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${QBITTORRENT_WEBUI_PORT}/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s      
    networks:
      - perceptor-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.torrent.rule=Host(`torrent.${DOMAIN}`)"
      - "traefik.http.routers.torrent.entrypoints=web"
      # Le indicamos a Traefik el puerto interno de la WebUI
      - "traefik.http.services.torrent.loadbalancer.server.port=${QBITTORRENT_WEBUI_PORT}"      
    
  indexer:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: perceptor-indexer
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8    
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - indexer_config:/config
    ports:
      - "${INDEXER_PORT}:9696"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9696/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s      
    networks:
      - perceptor-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.indexer.rule=Host(`indexer.${DOMAIN}`)"
      - "traefik.http.routers.indexer.entrypoints=web"
      - "traefik.http.services.indexer.loadbalancer.server.port=9696"      

volumes:
  mariadb_data:
  redis_data:
  qbittorrent_config: # Nuevo volumen para la config de qBittorrent    
  indexer_config: # Nuevo volumen para la config de Prowlarr

networks:
  perceptor-net:
    driver: bridge  