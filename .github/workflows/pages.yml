# Publishes the landing page in site/ to GitHub Pages. The site is plain static HTML with no build
# step, so the job only uploads the directory — actions/deploy-pages does the rest. Pages must be
# set to "GitHub Actions" as its source in the repository settings for this to have anywhere to go.
name: Pages

on:
  push:
    branches:
      - master
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; a queued run supersedes an older one rather than cancelling the
# deployment already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site/ to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
