name: CI

on:
  push:
    branches:
      - master
      - stage
      - dev
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: "24.18.0"

jobs:
  api:
    name: api — typecheck and test
    runs-on: ubuntu-latest
    # Two suites — auth/session.service.spec.ts and uploads/upload-tickets.service.spec.ts —
    # run against a real Redis on purpose, not a mock: the property each one asserts is that a
    # key actually left the store (a logout that stops authenticating, a ticket that cannot be
    # replayed), which a mock can only assert by construction. See the comment at the head of
    # either file. The job does not run in a container, so the service is reachable on
    # localhost through the published port rather than under its label.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npx tsc --noEmit

      - run: npx jest --ci

  web:
    name: web — typecheck and messages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/web/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: node scripts/check-messages.mjs

  worker:
    name: worker — typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/worker/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx vitest run

  site:
    name: site — regenerate and diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: node tools/site/build.mjs

      - run: git diff --exit-code site/

  audit:
    name: audit — production advisory gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: node tools/audit/check.mjs

  comments:
    name: comments — locator convention gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: node tools/comments/check.mjs

      - run: node tools/comments/check.spec.mjs
