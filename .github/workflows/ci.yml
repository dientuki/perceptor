name: CI

on:
  push:
    branches:
      - master
      - stage
      - dev
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: "24.18.0"

jobs:
  api:
    name: api — typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npx tsc --noEmit

      - run: npx jest --ci

  web:
    name: web — typecheck and messages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/web/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: node scripts/check-messages.mjs

  worker:
    name: worker — typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/worker/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx vitest run
