# Publishes the five own images to GHCR (dientuki/perceptor namespace) on every vX.Y.Z tag —
# REQ-1/REQ-2/NFR-1 — and on every vX.Y.Z-<prerelease> tag (a release candidate, cut from
# `stage`). `latest` is what an installation with no PERCEPTOR_TAG resolves to
# (docker-compose.yaml's `${PERCEPTOR_TAG:-latest}`). While the project is in closed alpha there
# is no final release for it to point at, so the newest release candidate is deliberately the
# best thing a default installation can run and every tag, RC or final, moves `latest`. Revisit
# this the moment a final vX.Y.Z ships: from then on an RC must publish under its exact tag only,
# or `latest` hands every default installation an untested build.
# web/api/worker build from their `prod` stage; torrent/indexer are
# single-stage Dockerfiles (linuxserver/qbittorrent, linuxserver/prowlarr bases) with no target
# to name. All five build for both linux/amd64 and linux/arm64 (083-multi-arch-images), each
# architecture built natively on a runner of its own kind rather than emulated — `build` is a
# matrix over service x platform that pushes by digest only, and `merge` is a matrix over the
# five services that assembles each one's two digests into a single manifest list and applies
# the tags. `merge` needs `build`, so a single failed leg — one service, one architecture —
# blocks every tag from moving, not only the broken image's: see the note at the foot of this
# file for what that guarantees.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

env:
  REGISTRY: ghcr.io
  NAMESPACE: dientuki

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.service }} (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      # One failed leg must not stop the workflow from reporting every other failure, but a
      # partial publish is still not a "done" release — see the note at the end of this file.
      fail-fast: false
      matrix:
        service: [web, api, worker, torrent, indexer]
        platform: [linux/amd64, linux/arm64]
        include:
          - service: web
            target: prod
          - service: api
            target: prod
          - service: worker
            target: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          # No tag is set here on purpose — applying one is `merge`'s job, once both
          # architectures' digests exist. The image name lives inside `outputs`, not as a tag;
          # nothing reachable by a tag exists at the end of this job.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/perceptor-${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true

      - name: Sanitize platform for artifact name
        id: platform
        run: echo "pair=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Export digest
        run: |
          mkdir -p /tmp/digest
          echo "${{ steps.build.outputs.digest }}" > /tmp/digest/digest.txt

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          # Name carries both the service and the platform — the one genuinely silent failure
          # risk in this workflow (plan.md § Risks): a collision across services would tag
          # `perceptor-web` with `api`'s digest, and the result pulls, starts and runs the wrong
          # program with no error anywhere.
          name: digest-${{ matrix.service }}-${{ steps.platform.outputs.pair }}
          path: /tmp/digest/digest.txt
          retention-days: 1

  merge:
    name: Merge ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, worker, torrent, indexer]
    steps:
      - name: Resolve image tags
        id: tags
        # SemVer: anything after the first hyphen is a prerelease identifier, so `v0.8.0-rc.1`
        # is an RC and `v0.8.0` is final. During the closed alpha both also move `latest` — see
        # the note at the top of this file for when that has to stop.
        run: |
          image="${REGISTRY}/${NAMESPACE}/perceptor-${{ matrix.service }}"
          tags="${image}:${GITHUB_REF_NAME}"$'\n'"${image}:latest"
          case "${GITHUB_REF_NAME}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          {
            echo "tags<<TAGS_EOF"
            echo "${tags}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.service }}-*
          path: /tmp/digests
          merge-multiple: false

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          image="${REGISTRY}/${NAMESPACE}/perceptor-${{ matrix.service }}"
          sources=()
          for dir in digest-${{ matrix.service }}-*/; do
            digest="$(cat "${dir}/digest.txt")"
            sources+=("${image}@${digest}")
          done
          tag_args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] && tag_args+=(--tag "${tag}")
          done <<< "${{ steps.tags.outputs.tags }}"
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Make package public
        # A fresh package on GHCR is created private by default even with GITHUB_TOKEN's
        # packages:write — REQ-1 needs it readable with no authentication (docker pull from a
        # logged-out client). Best-effort: an already-public package (every release after the
        # first) leaves this a no-op rather than a failure.
        continue-on-error: true
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/perceptor-${{ matrix.service }}" \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# NOTE (NFR-6, "the five images must always move together"): `merge` declares `needs: build`, and
# GitHub skips a matrix job once any leg of its `needs` matrix has failed — no tag is ever applied
# anywhere inside `build`, only inside `merge`, once both architectures' digests already exist.
# So the common case — one broken leg, one service, one architecture — blocks every tag from
# moving, not only the broken image's: a half-published tag cannot reach GHCR through this
# workflow. What is still not guaranteed is a partial `merge`: if one `merge` leg fails after
# `build` has gone fully green (for example a transient registry error), the other four services
# can still move while the fifth does not, leaving a mixed set across the five images. That case
# remains operational, not structural — watch this workflow's run to completion before telling
# anyone to pull the tag, and re-run the failed `merge` leg (or push a corrected tag) before
# considering the release done.
