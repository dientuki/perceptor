# Publishes the five own images to GHCR (dientuki/perceptor namespace) on every vX.Y.Z tag —
# REQ-1/REQ-2/NFR-1 — and on every vX.Y.Z-<prerelease> tag (a release candidate, cut from
# `stage`). A prerelease publishes under its exact tag ONLY: `latest` is what an installation
# with no PERCEPTOR_TAG resolves to (docker-compose.yaml's `${PERCEPTOR_TAG:-latest}`), so
# moving it to an RC would hand every such installation an untested build.
# web/api/worker build from their `prod` stage; torrent/indexer are
# single-stage Dockerfiles (linuxserver/qbittorrent, linuxserver/prowlarr bases) with no target
# to name. All five build for linux/amd64 only. One workflow run publishes all five or none —
# a partial publish would let an installation end up with a mixed set (plan.md § Contract Freeze),
# which is exactly what NFR-6 forbids.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

env:
  REGISTRY: ghcr.io
  NAMESPACE: dientuki

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and push ${{ matrix.service }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One failed service must not stop the workflow from reporting every other failure, but a
      # partial publish is still not a "done" release — see the note at the end of this file.
      fail-fast: false
      matrix:
        service: [web, api, worker, torrent, indexer]
        include:
          - service: web
            target: prod
          - service: api
            target: prod
          - service: worker
            target: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image tags
        id: tags
        # SemVer: anything after the first hyphen is a prerelease identifier, so `v0.8.0-rc.1`
        # is an RC and `v0.8.0` is final. An RC gets its exact tag and nothing else; only a
        # final release also moves `latest`.
        run: |
          image="${REGISTRY}/${NAMESPACE}/perceptor-${{ matrix.service }}"
          tags="${image}:${GITHUB_REF_NAME}"
          case "${GITHUB_REF_NAME}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)
              tags="${tags}"$'\n'"${image}:latest"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
          {
            echo "tags<<TAGS_EOF"
            echo "${tags}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Make package public
        # A fresh package on GHCR is created private by default even with GITHUB_TOKEN's
        # packages:write — REQ-1 needs it readable with no authentication (docker pull from a
        # logged-out client). Best-effort: an already-public package (every release after the
        # first) leaves this a no-op rather than a failure.
        continue-on-error: true
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/perceptor-${{ matrix.service }}" \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# NOTE (NFR-6, "the five images must always move together"): GitHub Actions has no built-in
# all-or-nothing matrix — a matrix job failure does not roll back the tags the other jobs already
# pushed. Nothing this repository controls can fully prevent a half-published tag once GHCR has
# accepted a push; the mitigation is operational, not code: watch this workflow's run to
# completion before telling anyone to pull the tag, and re-run the failed matrix leg (or push a
# corrected tag) before considering the release done.
